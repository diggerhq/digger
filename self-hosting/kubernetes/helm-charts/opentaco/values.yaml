# OpenTaco Umbrella Chart - Default Values
# 
# This chart deploys the complete OpenTaco platform:
#   - Database (PostgreSQL or Cloud SQL)
#   - Digger Managed
#   - Taco Statesman
#   - Token Service
#   - Drift Detection
#   - Taco UI

# ============================================================================
# Global Configuration
# ============================================================================
global:
  # Image registry for all custom images
  imageRegistry: ghcr.io/diggerhq

  # Pod annotations applied to all subchart workloads by default.
  # Each subchart can override these keys via its own podAnnotations map.
  podAnnotations: {}
  
  # Image pull policy
  imagePullPolicy: IfNotPresent
  
  # Shared secrets (create these before deploying)
  secrets:
    # WorkOS authentication (required for UI)
    workosSecretName: "workos-secrets"

# ============================================================================
# Database Configuration
# ============================================================================

# Option 1: Bring your own Postgres instance (in-cluster or external)
# Configure each child chart's postgres settings/secret references accordingly.
#
# Option 2: Use Cloud SQL
# Configure Cloud SQL under each child chart key:
#   - taco-statesman.taco.cloudSql
#   - taco-token-service.tokenService.cloudSql
# and any other enabled service that supports Cloud SQL.


# ============================================================================
# Taco Orchestrator Configuration
# ============================================================================
taco-orchestrator:
  enabled: true
  
  digger:
    image:
      repository: digger_backend
      tag: "latest"
    
    replicaCount: 1
    
    # Secret management
    secret:
      useExistingSecret: true
      existingSecretName: "taco-orchestrator-secrets"

    # URL configuration (used by orchestrator runtime)
    # Prefer setting these in the referenced secret when useExistingSecret=true.
    # These values are only used when the chart manages the secret.
    # - PUBLIC_BASE_URL should be the public app URL (for example https://app.yourdomain.com)
    # - INTERNAL_BASE_URL should be the in-cluster orchestrator URL
    # See taco-orchestrator values for full details.
    # publicBaseUrl: "https://app.opentaco.example.com"
    # internalBaseUrl: "http://opentaco-taco-orchestrator:3000"
    # hostname: ""  # Legacy fallback for older deployments
    
    # Resource limits (IMPORTANT: set for production)
    resources: {}
    #  requests:
    #    memory: 512Mi
    #    cpu: 500m
    #  limits:
    #    memory: 2Gi
    #    cpu: 2000m
    
    # Ingress configuration
    ingress:
      enabled: false
      className: "nginx"
      host: "api.opentaco.example.com"
      path: /
    
    # For detailed configuration (database, GitHub App, secrets, etc.),
    # see self-hosting/kubernetes/helm-charts/taco-orchestrator/values.yaml or use existingSecret above

# ============================================================================
# Taco Statesman Configuration
# ============================================================================
taco-statesman:
  enabled: true
  
  taco:
    image:
      repository: digger/taco-statesman
      tag: "latest"
    
    replicaCount: 1
    
    # Secret management
    secret:
      useExistingSecret: true
      existingSecretName: "statesman-secrets"

    # Public URL and signed URL behavior
    # Prefer setting these in the referenced secret when useExistingSecret=true.
    # - publicBaseUrl -> OPENTACO_PUBLIC_BASE_URL
    # - allowXForwardedFor -> OPENTACO_ALLOW_X_FORWARDED_FOR
    # - secretKey -> OPENTACO_SECRET_KEY (required for signed upload/download URLs)
    
    # Storage configuration (critical: choose memory or s3)
    storage:
      type: "memory"  # "memory" for dev, "s3" for production
      s3:
        bucket: ""    # S3 bucket name (required if type=s3)
        region: "us-east-1"
    
    # Cloud SQL configuration (for GCP)
    cloudSql:
      enabled: false
      instanceConnectionName: ""
      serviceAccount: "default"
      credentialsSecret: ""
    
    # Resource limits (IMPORTANT: set for production)
    resources: {}
    #  requests:
    #    memory: 256Mi
    #    cpu: 250m
    #  limits:
    #    memory: 1Gi
    #    cpu: 1000m
    
    # For detailed configuration (auth, JWT, postgres, OAuth, etc.),
    # see self-hosting/kubernetes/helm-charts/taco-statesman/values.yaml or use existingSecret above

# ============================================================================
# Token Service Configuration
# ============================================================================
taco-token-service:
  enabled: true
  
  tokenService:
    image:
      repository: digger/taco-token-service
      tag: "v0.1.0"
      pullPolicy: "IfNotPresent"
    
    replicaCount: 1

    # Secret management
    secret:
      useExistingSecret: true
      existingSecretName: "token-service-secrets"
    
    # Database configuration - Using Cloud SQL (same as other services)
    database:
      backend: postgres  # Use postgres with Cloud SQL

      # PostgreSQL (recommended for production)
      postgres:
        host: "127.0.0.1"  # Cloud SQL proxy provides local access
        port: 5432
        user: "token_svc"  # Match your Cloud SQL user
        dbname: "token_service"  # Match your Cloud SQL database
        sslmode: "disable"  # Proxy handles SSL
        secretName: "token-service-secrets"
        secretKey: "OPENTACO_TOKEN_POSTGRES_PASSWORD"
      
  
    # Cloud SQL configuration (enabled - same as statesman)
    cloudSql:
      enabled: true  # Enable Cloud SQL proxy
      instanceConnectionName: "YOUR-PROJECT-ID:YOUR-REGION:YOUR-INSTANCE"  # Match your Cloud SQL instance
      credentialsSecret: "cloudsql-credentials"  # Match existing secret
      serviceAccount: "cloudsql-sa"  # Match existing SA
    
    # Resource limits (IMPORTANT: set for production)
    resources: {}
    #  requests:
    #    memory: 256Mi
    #    cpu: 250m
    #  limits:
    #    memory: 1Gi
    #    cpu: 1000m
    
    # Service configuration
    service:
      type: ClusterIP
      port: 8081
    
    # For detailed configuration, see self-hosting/kubernetes/helm-charts/taco-token-service/values.yaml

# ============================================================================
# Drift Detection Configuration
# ============================================================================
taco-drift:
  enabled: true
  
  drift:
    image:
      repository: digger/drift
      tag: "latest"
    
    replicaCount: 1
    
    # Secret management
    secret:
      useExistingSecret: true
      existingSecretName: "drift-secrets"

    # Drift hostname split (set in drift-secrets when useExistingSecret=true):
    # - DIGGER_HOSTNAME should be the internal drift service URL
    #   (for example http://opentaco-taco-drift:3004)
    # - DIGGER_DRIFT_REPORTER_HOSTNAME should be the public base URL
    #   (for example https://app.yourdomain.com)
    
    # Resource limits (IMPORTANT: set for production)
    resources: {}
    #  requests:
    #    memory: 256Mi
    #    cpu: 250m
    #  limits:
    #    memory: 1Gi
    #    cpu: 1000m
    
    # Ingress configuration
    ingress:
      enabled: false
      className: "nginx"
      host: "drift.opentaco.example.com"
      path: /

    # CronJobs for periodic drift processing
    cronjobs:
      enabled: false
    
    # For detailed configuration (GitHub App, database, webhook secrets, etc.),
    # see self-hosting/kubernetes/helm-charts/taco-drift/values.yaml or use existingSecret above

# ============================================================================
# Taco UI Configuration
# ============================================================================
taco-ui:
  enabled: true
  
  ui:
    image:
      repository: digger/taco-ui
      tag: "v0.1.0"
    
    replicaCount: 1
    
    # Secret management
    secret:
      useExistingSecret: true
      existingSecretName: "ui-secrets"
    
    # Environment configuration (cross-service URLs)
    env:
      publicUrl: "https://app.opentaco.example.com"
      # Allowed hosts (customize for your domain)
      allowedHosts: ""
      
      # Backend service URLs (for server-side API calls)
      backends:
        # These defaults assume release name "opentaco".
        # If you install with a different release name, update these hostnames.
        orchestratorUrl: "http://opentaco-taco-orchestrator-web:3000"
        driftReportingUrl: "http://opentaco-taco-drift:3004"
        statesmanUrl: "http://opentaco-taco-statesman:8080"
        tokensServiceUrl: "http://opentaco-taco-token-service:8081"
    
    ingress:
      enabled: false
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - host: app.opentaco.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: opentaco-ui-tls
          hosts:
            - app.opentaco.example.com
    
    # Resource limits (IMPORTANT: set for production)
    resources: {}
    #  requests:
    #    memory: 256Mi
    #    cpu: 250m
    #  limits:
    #    memory: 1Gi
    #    cpu: 1000m
    
    # For detailed configuration (WorkOS, PostHog, webhook secrets, etc.),
    # see self-hosting/kubernetes/helm-charts/taco-ui/values.yaml or use existingSecret above

# ============================================================================
# Additional Configuration
# ============================================================================

# Create NetworkPolicies (optional)
networkPolicies:
  enabled: false

# Service Monitor for Prometheus (optional)
serviceMonitor:
  enabled: false
