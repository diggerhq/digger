suite: test image pull secrets
templates:
  - backend-deployment.yaml
tests:
  - it: should not set imagePullSecrets by default
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: should set imagePullSecrets when configured
    set:
      digger.imagePullSecrets:
        - name: ghcr-auth
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: ghcr-auth
