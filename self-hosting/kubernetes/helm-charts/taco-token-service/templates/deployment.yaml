apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taco-token-service.fullname" . }}
  labels:
    {{- include "taco-token-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.tokenService.replicaCount }}
  selector:
    matchLabels:
      {{- include "taco-token-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $podAnnotations := mergeOverwrite (dict) (default (dict) .Values.global.podAnnotations) (default (dict) .Values.tokenService.podAnnotations) }}
      {{- if $podAnnotations }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "taco-token-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- if and .Values.tokenService.cloudSql .Values.tokenService.cloudSql.enabled }}
      serviceAccountName: {{ .Values.tokenService.cloudSql.serviceAccount | default "default" }}
      {{- end }}
      containers:
        - name: token-service
          image: "{{ .Values.tokenService.image.registry | default .Values.global.imageRegistry | default "ghcr.io/diggerhq" }}/{{ .Values.tokenService.image.repository }}:{{ .Values.tokenService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.tokenService.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.tokenService.service.port }}
              protocol: TCP
          {{- if .Values.tokenService.secret.useExistingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.tokenService.secret.existingSecretName }}
          {{- end }}
          env:
            - name: OPENTACO_TOKEN_SERVICE_PORT
              value: "{{ .Values.tokenService.service.port }}"
            {{- if not .Values.tokenService.secret.useExistingSecret }}
            - name: OPENTACO_TOKEN_QUERY_BACKEND
              value: "{{ .Values.tokenService.database.backend }}"

            # PostgreSQL configuration
            - name: OPENTACO_TOKEN_POSTGRES_HOST
              value: "{{ .Values.tokenService.database.postgres.host }}"
            - name: OPENTACO_TOKEN_POSTGRES_PORT
              value: "{{ .Values.tokenService.database.postgres.port }}"
            - name: OPENTACO_TOKEN_POSTGRES_USER
              value: "{{ .Values.tokenService.database.postgres.user }}"
            - name: OPENTACO_TOKEN_POSTGRES_DBNAME
              value: "{{ .Values.tokenService.database.postgres.dbname }}"
            - name: OPENTACO_TOKEN_POSTGRES_SSLMODE
              value: "{{ .Values.tokenService.database.postgres.sslmode }}"
            {{- if .Values.tokenService.database.postgres.secretName }}
            - name: OPENTACO_TOKEN_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tokenService.database.postgres.secretName }}
                  key: {{ .Values.tokenService.database.postgres.secretKey | default "OPENTACO_TOKEN_POSTGRES_PASSWORD" }}
            {{- else if .Values.tokenService.database.postgres.password }}
            - name: OPENTACO_TOKEN_POSTGRES_PASSWORD
              value: "{{ .Values.tokenService.database.postgres.password }}"
            {{- end }}

            {{- end }}
          
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      
      {{- if and .Values.tokenService.cloudSql .Values.tokenService.cloudSql.enabled }}
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "{{ .Values.tokenService.cloudSql.instanceConnectionName }}"
          securityContext:
            runAsNonRoot: true
          {{- if .Values.tokenService.cloudSql.credentialsSecret }}
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/cloudsql/credentials.json
          volumeMounts:
            - name: cloudsql-credentials
              mountPath: /secrets/cloudsql
              readOnly: true
          {{- end }}
      {{- end }}
      
      {{- if and .Values.tokenService.cloudSql .Values.tokenService.cloudSql.enabled .Values.tokenService.cloudSql.credentialsSecret }}
      volumes:
        - name: cloudsql-credentials
          secret:
            secretName: {{ .Values.tokenService.cloudSql.credentialsSecret }}
      {{- end }}
