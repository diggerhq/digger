---
name: EE Backend Go Tests

"on":
  push:
    branches: ['develop']
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Download Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.4
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Test that the docker image still builds successfully
        uses: depot/setup-action@v1
      
      - name: Build Docker image with Depot
        uses: depot/build-push-action@v1
        with:
          project: kcld4zgwzx
          token: ${{ secrets.DEPOT_TOKEN }}
          context: .
          file: ./Dockerfile_backend_ee
          push: false
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: Deps
        run: go get -v ./...
        working-directory: ee/backend

      - name: Build
        run: go build
        working-directory: ee/backend

      - name: Test
        run: go test -v ./...
        env:
          GITHUB_PAT_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        working-directory: ee/backend
