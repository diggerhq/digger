---
name: release dgctl

"on":
  release:
    branches:
      - 'go'
    types:
      - 'released'

jobs:
  binary:
    if: "!startsWith(github.event.release.tag_name, 'taco/')"
    strategy:
      matrix:
        arch: [arm, arm64, amd64, "386"]
        os: [linux, darwin, freebsd, windows]
        exclude:
          - os: darwin
            arch: arm
          - os: darwin
            arch: "386"

    runs-on: ubuntu-latest

    steps:
      - name: Download Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.4
        id: go

      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build
        run: |
          env GOOS=${{matrix.os}} GOARCH=${{matrix.arch}} CGO_ENABLED=0 go build -o dgctl_bin ./dgctl/main.go

      - name: Publish exec to github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp dgctl_bin dgctl-${{ matrix.os }}-${{ matrix.arch }}
          gh release upload "${{ github.event.release.tag_name }}" dgctl-${{ matrix.os }}-${{ matrix.arch }} --clobber
